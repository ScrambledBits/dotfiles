name: chezmoi dry-run

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write a CI chezmoi config
        # `chezmoi init` can't be fed non-interactively here: this repo's
        # .chezmoi.toml.tmpl uses promptStringOnce, and neither --promptString
        # nor --promptDefaults populate that function (verified locally against
        # chezmoi v2.72.0 — both still try to open a TTY). Writing the config
        # chezmoi init would have generated sidesteps prompting entirely.
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          cat > "$HOME/.config/chezmoi/chezmoi.toml" <<'TOML'
          [data]
              name = "CI Runner"
              email = "ci@example.com"
              gitSigningKey = ""
          TOML

      - name: Render and apply dotfiles (dry-run, no destination changes)
        run: chezmoi --source "$GITHUB_WORKSPACE" --no-tty --no-pager apply --dry-run --verbose

      - name: Render every run_/run_once_/run_onchange_ script for shellcheck
        run: |
          mkdir -p /tmp/rendered
          for f in run_once_*.sh.tmpl run_onchange_*.sh.tmpl; do
            [ -e "$f" ] || continue
            chezmoi --source "$GITHUB_WORKSPACE" execute-template < "$f" > "/tmp/rendered/${f%.tmpl}"
          done
          cp run_once_after_setup-ssh-sockets.sh dot_config/git/hooks/executable_pre-commit /tmp/rendered/ 2>/dev/null || true

      - name: Install shellcheck (macos-latest doesn't ship it)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Shellcheck rendered scripts
        run: |
          for f in /tmp/rendered/*; do
            # OS-guarded templates (e.g. darwin-only scripts on the linux
            # runner) correctly render to just a trailing newline; skip those
            # rather than let shellcheck flag them as missing a shebang.
            grep -q '[^[:space:]]' "$f" || continue
            echo "--- $f ---"
            shellcheck "$f"
          done

      - name: Starship config validates cleanly
        run: |
          curl -sS https://starship.rs/install.sh | sh -s -- --yes
          STARSHIP_CONFIG="$GITHUB_WORKSPACE/dot_config/starship.toml" starship print-config >/dev/null

      - name: Ensure zsh is available (ubuntu-latest usually ships it already)
        if: runner.os == 'Linux'
        run: command -v zsh || sudo apt-get update -qq && sudo apt-get install -y zsh

      - name: Apply into a scratch HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/cache"
          chezmoi --config "$HOME/.config/chezmoi/chezmoi.toml" \
            --source "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/home" \
            --cache "$RUNNER_TEMP/cache" \
            --persistent-state "$RUNNER_TEMP/state.boltdb" \
            --no-tty apply --exclude scripts
          ls "$RUNNER_TEMP/home/.zshrc" "$RUNNER_TEMP/home/.oh-my-zsh" "$RUNNER_TEMP/home/.config" >/dev/null

      - name: Syntax-check the rendered shell files
        run: |
          zsh -n "$RUNNER_TEMP/home/.zshrc"
          zsh -n "$RUNNER_TEMP/home/.config/shell/paths"

      - name: Interactive shell smoke test
        # A real pty is required: zsh started via -c with no controlling
        # terminal prints spurious "can't change option: zle" noise that a
        # genuine interactive session (this check's whole point) never sees.
        run: |
          python3 - "$RUNNER_TEMP/home" <<'PYEOF'
          import os, pty, sys, time, select, signal

          home = sys.argv[1]
          # "k" (kubectl) is deliberately excluded: the OMZ kubectl plugin
          # guards its whole plugin file behind `commands[kubectl]`, and this
          # scratch apply intentionally excludes scripts (--exclude scripts),
          # so no package manager ever installs kubectl here. "tf" has no
          # such guard in the OMZ terraform plugin, so it stays. The trailing
          # "; exit" is required: `zsh -ic` without it drops into an
          # interactive prompt after the command runs instead of returning.
          cmd = "type gst kctx tf rec projects; exit"
          pid, fd = pty.fork()
          if pid == 0:
              os.environ["HOME"] = home
              os.environ["TERM"] = "xterm-256color"
              # Skips OMZ's compaudit insecure-directory check (oh-my-zsh.sh),
              # which otherwise prompts interactively and hangs forever on a
              # pty with nothing to feed it keystrokes — the real machine at
              # ~/.oh-my-zsh has normal permissions and never hits this; only
              # a scratch $RUNNER_TEMP tree is at risk of tripping it.
              os.environ["ZSH_DISABLE_COMPFIX"] = "true"
              os.chdir(home)
              os.execvp("zsh", ["zsh", "-ic", cmd])

          out = b""
          timed_out = True
          deadline = time.time() + 30
          while time.time() < deadline:
              r, _, _ = select.select([fd], [], [], 1)
              if fd in r:
                  try:
                      chunk = os.read(fd, 4096)
                  except OSError:
                      timed_out = False
                      break
                  if not chunk:
                      timed_out = False
                      break
                  out += chunk

          if timed_out:
              os.kill(pid, signal.SIGKILL)

          _, status = os.waitpid(pid, 0)
          text = out.decode(errors="replace").replace("\r", "")
          print(text)

          if timed_out:
              sys.exit("timed out waiting for the interactive shell")

          exit_code = os.waitstatus_to_exitcode(status)
          if exit_code != 0:
              sys.exit(f"interactive shell exited {exit_code}")
          for name in ("gst", "kctx", "tf", "rec", "projects"):
              if f"{name} not found" in text or f"{name}: command not found" in text:
                  sys.exit(f"alias '{name}' did not resolve")
          if "command not found" in text:
              sys.exit("unexpected 'command not found' in shell startup")
          PYEOF
