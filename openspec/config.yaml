schema: spec-driven

context: |
  Personal dotfiles managed with chezmoi (source dir = this repo). Targets macOS (arm64/x86) and headless Linux.
  Source naming: dot_ prefix, .tmpl = Go template, run_once_/run_onchange_ scripts. See CLAUDE.md for conventions.
  README.md is Spanish and must stay Spanish; CHANGELOG.md gets an entry per landed change.
  Shell scripts: set -o errexit -o nounset -o pipefail, printf not echo, long options, "${var}" quoting.
  Never push; feature branches only; no AI attribution in commits.
  Verification tools available: chezmoi (execute-template, apply --destination <scratch>), shellcheck, starship print-config, mise, brew bundle check.
